# Client-facing S3 entrypoint.
#
# This is the only process in the deployment that listens on a published host
# port. It lives on the `edge` network only - it has no interface on the
# cluster network, so even a full compromise of nginx yields no direct path to
# a master, volume server, filer or the metadata database.

upstream s3_gateways {
    least_conn;
    # Static IPs are pinned in docker-compose.yml so nginx's start-up
    # resolution stays valid across gateway restarts.
    server s3-gw-1:8333 max_fails=2 fail_timeout=5s;
    server s3-gw-2:8333 max_fails=2 fail_timeout=5s;
}

server {
    listen 8333 default_server;
    server_name _;

    # S3 objects can be large and SigV4 streaming must not be buffered to disk.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    # SigV4 signs the Host header; it must be forwarded byte-for-byte or every
    # request fails with SignatureDoesNotMatch.
    ignore_invalid_headers off;
    underscores_in_headers on;

    location / {
        proxy_pass http://s3_gateways;
        proxy_http_version 1.1;

        proxy_set_header Host               $http_host;
        proxy_set_header Connection         "";
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Fail over to the surviving gateway. Note: with request buffering off
        # a non-idempotent request already streaming its body cannot be
        # replayed, so writes in flight at the moment of failure surface as an
        # error to the client and must be retried by the SDK.
        proxy_next_upstream     error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_connect_timeout   2s;
        proxy_send_timeout      300s;
        proxy_read_timeout      300s;
    }
}
